<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Code - CodeShare</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f0f2f5;
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 30px;
        }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }
        textarea {
            width: 100%;
            height: 220px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: "Courier New", monospace;
            font-size: 14px;
            resize: vertical;
            margin-bottom: 18px;
        }
        input[type="text"] {
            width: 120px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-align: center;
            margin-bottom: 20px;
        }
        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 0.95rem;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #16a34a; }
        .back {
            display: inline-block;
            margin-top: 20px;
            color: #3b82f6;
            text-decoration: none;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Share your code</h1>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <label>Your Code / Text</label>
            <textarea name="text" required placeholder="Paste your code here..."></textarea>

            <label>4-digit PIN</label>
            <input type="text" name="pin" maxlength="4" pattern="\d{4}" required placeholder="1234" inputmode="numeric">

            <button type="submit">Share Code</button>
        </form>

        <a href="{% url 'home_page' %}" class="back">← Back to home</a>
    </div>
</body>
</html>
