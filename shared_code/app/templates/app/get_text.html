<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Code - CodeShare</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f0f2f5;
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 30px;
        }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }
        input[type="text"] {
            width: 140px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1.3rem;
            letter-spacing: 4px;
            text-align: center;
            margin-bottom: 16px;
        }
        button {
            padding: 12px 24px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
        }
        button:hover { background: #2563eb; }
        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
        }
        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 10px;
        }
        .code-header h3 {
            font-size: 1.1rem;
        }
        .copy-btn {
            padding: 8px 16px;
            background: #e5e7eb;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 600;
        }
        .copy-btn:hover { background: #d1d5db; }
        .copy-btn.copied {
            background: #22c55e;
            color: white;
        }
        .code-box {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 16px;
            border-radius: 8px;
            font-family: "Courier New", monospace;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-x: auto;
        }
        .meta {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #666;
        }
        .back {
            display: inline-block;
            margin-top: 25px;
            color: #3b82f6;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Get shared code</h1>

        <form method="get">
            <label>Enter 4-digit PIN</label>
            <input type="text" name="pin" maxlength="4" value="{{ pin }}" required inputmode="numeric" pattern="\d{4}">
            <br>
            <button type="submit">Get Code</button>
        </form>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        {% if text_obj %}
            <div class="code-header">
                <h3>PIN: {{ text_obj.pin }}</h3>
                <button class="copy-btn" onclick="copyCode()">Copy</button>
            </div>
            <div class="code-box" id="codeContent">{{ text_obj.text }}</div>
            <p class="meta">Shared at: {{ text_obj.created_at }}</p>
        {% endif %}

        <a href="{% url 'home_page' %}" class="back">← Back to home</a>
    </div>

    <script>
        function copyCode() {
            const text = document.getElementById('codeContent').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = 'Copy';
                    btn.classList.remove('copied');
                }, 2000);
            });
        }
    </script>
</body>
</html>
