<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeShare</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f0f2f5;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 12px;
            color: #1a1a1a;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-green { background: #22c55e; }
        .btn-green:hover { background: #16a34a; }
        .btn-blue { background: #3b82f6; }
        .btn-blue:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="card">
        <h1>CodeShare</h1>
        <p>Share code instantly with a 4-digit PIN.<br>Auto-deletes after 24 hours.</p>
        
        <a href="{% url 'create_text' %}" class="btn btn-green">Share Code</a>
        <a href="{% url 'get_text' %}" class="btn btn-blue">Get Code</a>
    </div>
</body>
</html>
