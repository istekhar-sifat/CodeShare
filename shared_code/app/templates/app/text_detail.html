<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Successfully - CodeShare</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f0f2f5;
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 30px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #16a34a;
        }
        .pin-box {
            background: #f0fdf4;
            border: 2px solid #22c55e;
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            margin: 20px 0;
        }
        .pin {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 6px;
            color: #15803d;
        }
        .note {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .copy-btn {
            padding: 8px 16px;
            background: #e5e7eb;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 600;
        }
        .copy-btn:hover { background: #d1d5db; }
        .copy-btn.copied {
            background: #22c55e;
            color: white;
        }
        .code-box {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 16px;
            border-radius: 8px;
            font-family: "Courier New", monospace;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-x: auto;
            margin-bottom: 25px;
        }
        .links a {
            display: inline-block;
            margin-right: 15px;
            color: #3b82f6;
            text-decoration: none;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✓ Code shared successfully!</h1>
        
        <div class="pin-box">
            <div style="font-size:0.9rem; color:#666; margin-bottom:6px;">Your PIN</div>
            <div class="pin">{{ text_obj.pin }}</div>
        </div>

        <p class="note">Share this PIN with others. The code will automatically delete after 24 hours.</p>

        <div class="code-header">
            <strong>Your code:</strong>
            <button class="copy-btn" onclick="copyCode()">Copy</button>
        </div>
        <div class="code-box" id="codeContent">{{ text_obj.text }}</div>

        <div class="links">
            <a href="{% url 'home_page' %}">← Home</a>
            <a href="{% url 'get_text' %}">Get another code</a>
        </div>
    </div>

    <script>
        function copyCode() {
            const text = document.getElementById('codeContent').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = 'Copy';
                    btn.classList.remove('copied');
                }, 2000);
            });
        }
    </script>
</body>
</html>
